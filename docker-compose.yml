services:
  db2:
    # jdbc:db2://localhost:50000/guest:user=db2inst1;password=root_pass;
#    image: datagrip/db2
    image: ibmcom/db2:11.5.7.0
    container_name: ibm_db2_11.5
    privileged: true
    ports:
      - "50000:50000"
    environment:
      LICENSE: accept
      DB2INST1_PASSWORD: root_pass1
      DBNAME: demo
      DB2COMM: TCPIP
      PERSISTENT_HOME: false  # Avoids permission issues on restar
    volumes:
      - db2_data:/database
      - ./src/main/resources/dbs/db2/init-db2.sql:/docker-entrypoint-initdb.d/init2.sql
    profiles:
      - db2
    command: >
      bash -c "su - db2inst1 -c 'db2start && sleep 20 && db2 -tvf /docker-entrypoint-initdb.d/init2.sql'"
  mssql_2019:
    # jdbc:sqlserver://localhost:1434;databaseName=demo_db;encrypt=false;trustServerCertificate=true
    container_name: mssql_2019
    privileged: true
    image: datagrip/mssql-server-linux:2019
    hostname: mssql_2019
    ports:
      - "1434:1433"
    environment:
      ACCEPT_EULA: Y
      SA_PASSWORD: 123_root_pass_123
      MSSQL_DB: demo_db
      MSSQL_PID: Developer
      MSSQL_AGENT_ENABLED: true
      MSSQL_USER: demo_user
      MSSQL_PASSWORD: demo_pass
    mem_limit: 4g
    healthcheck:
      test: grep "Starting up database '${MSSQL_DB}'." /var/opt/mssql/log/errorlog || exit 1
      interval: 3m
      timeout: 10s
      retries: 5
    profiles:
      - mssql
