version: "3.7"
services:
  mariadb:
      image: mariadb:10.11.5
      container_name: mariadb-10.11.5
      environment:
        MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "yes"
        MARIADB_DATABASE: demo_maria
        MARIADB_USER: root
#        MARIADB_USER: app
#        MARIADB_PASSWORD: app
      ports:
        - "3307:3306"
      volumes:
        - mariadb_data:/var/lib/mysql

volumes:
  mariadb_data: