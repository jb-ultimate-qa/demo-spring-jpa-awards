spring.application.name=demo-awards-spring

#server.port=8081
#spring.datasource.url=jdbc:postgresql://localhost:5432/${PG_TABLE}
spring.datasource.url=jdbc:postgresql://localhost:5432/awards-spr
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driverClassName=org.postgresql.Driver
#spring.datasource.driver-class-name=org.postgresql.Driver

spring.flyway.enabled=false
spring.flyway.locations=classpath:db/pg/migration
spring.liquibase.enabled=false
spring.liquibase.change-log=db/pg/changelog/main-changelog.xml