spring.application.name=demo-awards-spring

#server.port=8081
#spring.datasource.url=jdbc:postgresql://localhost:5432/${PG_TABLE}
spring.datasource.url=jdbc:postgresql://localhost:5432/awards-spr
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driverClassName=org.postgresql.Driver

mysql_db=demo
mysql_user=root
mysql_pass=root
spring.ds-mysql.url=jdbc:mysql://localhost:3306/${mysql_db}?allowPublicKeyRetrieval=true
spring.ds-mysql.username=${mysql_user}
spring.ds-mysql.password=${mysql_pass}
spring.ds-mysql.driverClassName=com.mysql.cj.jdbc.Driver


spring.flyway.enabled=false
spring.liquibase.enabled=false
#spring.liquibase.change-log=db/changelog/main-changelog.xml