#      bash -c "
#      su - db2inst1 -c '
#        db2start;
#        until db2 connect to db2award; do
#          echo waiting for db2award;
#          sleep 5;
#        done;
#        db2 -tvf /docker-entrypoint-initdb.d/init_schema.sql > /tmp/init_schema.log 2>&1;
#        cat /tmp/init_schema.log;
#        db2 connect reset;
#        tail -f /dev/null'"

#_______________________________________________________________________________________________________________

  mssql_2019:
    container_name: mssql_awards
    platform: linux/amd64
    privileged: true
    image: datagrip/mssql-server-linux:2019
    hostname: mssql_2019
    ports:
      - "1434:1433"
    environment:
      ACCEPT_EULA: Y
      SA_PASSWORD: My@Super@SecretRoot
      MSSQL_DB: mssql_awards
      MSSQL_PID: Developer
      MSSQL_AGENT_ENABLED: true
      MSSQL_USER: demo_user
      MSSQL_PASSWORD: My@Super@Secret
#    profiles:
#      - mssql
    mem_limit: 2g
    healthcheck:
      test: [ "CMD-SHELL", "/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$$SA_PASSWORD\" -Q \"SELECT 1\" -C -t 1 || exit 1" ]
      interval: 3m
      timeout: 10s
      retries: 5
    volumes:
      - mssql_data:/var/lib/mssql
      - ./db_docker_init/ms:/docker-entrypoint-initdb.d
  # run scripts manually, in terminal:
  # docker exec mssql_awards /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P 'My@Super@SecretRoot' -C -i /docker-entrypoint-initdb.d/02_init_schema.sql

  #_______________________________________________________________________________________________________________

  azure_edge: # like MSSQL, also supported in Diff generation
    #  connect from IDEA using url=jdbc:sqlserver://localhost:14337;databaseName=testdb;user=tester;password=My@Super@Secret;encrypt=false;trustServerCertificate=true
    #  username=sa, password=My@Super@Secret
    # jdbc:sqlserver://localhost:14337;databaseName=testdb;user=guest;password=guest1234
    image: registry.jetbrains.team/p/datagrip/containers/azure:2.0
    container_name: azure_edge
    platform: linux/amd64
    privileged: true
    hostname: azure_edge
    ports:
      - "14337:1433"
    environment:
      ACCEPT_EULA: Y
      MSSQL_SA_PASSWORD: My@Super@Secret
      MSSQL_DB: testdb
      MSSQL_PID: Developer
      MSSQL_AGENT_ENABLED: true
      MSSQL_USER: tester
      MSSQL_PASSWORD: My@Super@Secret
    healthcheck:
      test: grep "Starting up database 'testdb'." /var/opt/mssql/log/errorlog || exit 1
      interval: 1m
      timeout: 30s
      retries: 5

  #_______________________________________________________________________________________________________________
volumes:
  postgres_data:
  db2_data:
  mssql_data: