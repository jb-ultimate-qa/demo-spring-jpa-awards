services:
  postgres:
    image: postgres:18.4-alpine # 104 MB
    container_name: postgres-awards-spr
    environment:
      POSTGRES_DB: postgres-awards-spr
      POSTGRES_USER: ideatest
      POSTGRES_PASSWORD: ideatest
#    profiles:
#      - pgdocker
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./db_docker_init/pg:/docker-entrypoint-initdb.d # mounted scripts are executed on volume create only
      # to rerun scripts, execute in terminal:
      # docker exec idea-postgres sh -c "psql -v ON_ERROR_STOP=1 -U ideatest -d ideatest -f /docker-entrypoint-initdb.d/01_create_schema.sql && psql -v ON_ERROR_STOP=1 -U ideatest -d ideatest -f /docker-entrypoint-initdb.d/02_fill_data.sql"

  #_______________________________________________________________________________________________________________

  db2_11.5:
    container_name: db2_awards
    privileged: true
#    image: datagrip/db2:11.5.8
    image: ibmcom/db2:11.5.7.0
    #  profiles:
    #    - db2
    ports:
      - "50001:50000"
    environment:
      LICENSE: accept
      DBNAME: db2award
      DB2INSTANCE: db2inst1
      DB2INST1_PASSWORD: db2inst1
      DB2COMM: TCPIP
      PERSISTENT_HOME: false  # Avoids permission issues on restart
    volumes:
      - db2_data:/database
      - ./db_docker_init/db2:/docker-entrypoint-initdb.d # mounted scripts are not executed automatically
# run scripts manually, in terminal:
# docker exec db2_awards su - db2inst1 -c "db2 -tvf /docker-entrypoint-initdb.d/init_schema.sql"

# the autocommand doesn't work!!!
